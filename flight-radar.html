<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar Fluturimesh</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,sans-serif;background:#0b1220;color:#e5e7eb}
  #map{position:absolute;inset:0}
  .bar{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:1000;
       background:rgba(11,18,32,.9);padding:8px 14px;border-radius:12px;font-size:14px;
       display:flex;gap:10px;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,.4);white-space:nowrap}
  .bar b{color:#fbbf24}
  .bar button{background:#fbbf24;border:0;border-radius:8px;padding:5px 10px;font-weight:600;cursor:pointer}
  #info{position:absolute;bottom:0;left:0;right:0;z-index:1000;background:rgba(11,18,32,.95);
        padding:14px 16px 20px;border-radius:16px 16px 0 0;display:none;font-size:14px;line-height:1.6}
  #info h2{margin:0 0 6px;font-size:20px;color:#fbbf24}
  #info .grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px}
  #info .x{position:absolute;right:14px;top:10px;background:none;border:0;color:#9ca3af;font-size:22px;cursor:pointer}
  .plane{color:#fbbf24;font-size:20px;line-height:20px;text-shadow:0 0 3px #000;transition:transform .3s}
  .plane.sel{color:#f87171}
</style>
</head>
<body>
<div id="map"></div>
<div class="bar">✈️ <span id="status">Duke ngarkuar…</span><button id="refresh">↻</button></div>
<div id="info"><button class="x" onclick="closeInfo()">×</button><div id="infoBody"></div></div>

<script>
// Të dhënat live: OpenSky Network (falas, pa llogari ~400 kërkesa/ditë)
const API = "https://opensky-network.org/api/states/all";
const REFRESH_MS = 15000;

const map = L.map("map", { zoomControl: false }).setView([42.6, 20.9], 7); // Kosova/Ballkani
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
  attribution: "© OpenStreetMap, © CARTO | Data: OpenSky Network", maxZoom: 12
}).addTo(map);

const markers = new Map();
let selected = null, timer = null;

function icon(heading, sel) {
  return L.divIcon({
    className: "",
    html: `<div class="plane${sel ? " sel" : ""}" style="transform:rotate(${(heading||0) - 45}deg)">✈</div>`,
    iconSize: [20, 20], iconAnchor: [10, 10]
  });
}

async function load() {
  clearTimeout(timer);
  if (map.getZoom() < 5) {
    setStatus("Zmadho hartën për të parë avionët");
    timer = setTimeout(load, REFRESH_MS); return;
  }
  const b = map.getBounds();
  const url = `${API}?lamin=${b.getSouth()}&lomin=${b.getWest()}&lamax=${b.getNorth()}&lomax=${b.getEast()}`;
  try {
    setStatus("Duke përditësuar…");
    const r = await fetch(url);
    if (r.status === 429) throw new Error("Limiti ditor i OpenSky u arrit");
    if (!r.ok) throw new Error("Gabim " + r.status);
    const data = await r.json();
    draw(data.states || []);
  } catch (e) {
    setStatus("⚠️ " + e.message);
  }
  timer = setTimeout(load, REFRESH_MS);
}

function draw(states) {
  const seen = new Set();
  let count = 0;
  for (const s of states) {
    const [icao, callsign, country, , , lon, lat, baroAlt, onGround, velocity, heading, vRate, , geoAlt, squawk] = s;
    if (lat == null || lon == null || onGround) continue;
    seen.add(icao); count++;
    const f = { icao, callsign: (callsign || "").trim() || icao.toUpperCase(), country,
                lat, lon, alt: geoAlt ?? baroAlt, velocity, heading, vRate, squawk };
    let m = markers.get(icao);
    if (!m) {
      m = L.marker([lat, lon], { icon: icon(heading, icao === selected) }).addTo(map);
      m.on("click", () => select(icao));
      markers.set(icao, m);
    } else {
      m.setLatLng([lat, lon]);
      m.setIcon(icon(heading, icao === selected));
    }
    m.flight = f;
    if (icao === selected) showInfo(f);
  }
  for (const [id, m] of markers) if (!seen.has(id)) { map.removeLayer(m); markers.delete(id); }
  setStatus(`<b>${count}</b> avionë në ajër · ${new Date().toLocaleTimeString("sq-AL")}`);
}

function select(icao) {
  const prev = selected; selected = icao;
  [prev, icao].forEach(id => { const m = markers.get(id); if (m) m.setIcon(icon(m.flight.heading, id === selected)); });
  showInfo(markers.get(icao).flight);
}

function showInfo(f) {
  const fmt = (v, k, u) => v == null ? "–" : Math.round(v * k).toLocaleString("sq-AL") + " " + u;
  document.getElementById("infoBody").innerHTML = `
    <h2>${f.callsign}</h2>
    <div class="grid">
      <div>Vendi i regjistrimit</div><div>${f.country}</div>
      <div>Lartësia</div><div>${fmt(f.alt, 1, "m")} (${fmt(f.alt, 3.281, "ft")})</div>
      <div>Shpejtësia</div><div>${fmt(f.velocity, 3.6, "km/h")}</div>
      <div>Drejtimi</div><div>${fmt(f.heading, 1, "°")}</div>
      <div>Ngjitja/zbritja</div><div>${fmt(f.vRate, 1, "m/s")}</div>
      <div>Kodi ICAO24</div><div>${f.icao.toUpperCase()}</div>
      <div>Squawk</div><div>${f.squawk || "–"}</div>
    </div>`;
  document.getElementById("info").style.display = "block";
}

function closeInfo() {
  const m = markers.get(selected); selected = null;
  if (m) m.setIcon(icon(m.flight.heading, false));
  document.getElementById("info").style.display = "none";
}

function setStatus(h) { document.getElementById("status").innerHTML = h; }

let moveT;
map.on("moveend", () => { clearTimeout(moveT); moveT = setTimeout(load, 800); });
document.getElementById("refresh").onclick = load;
load();
</script>
</body>
</html>
