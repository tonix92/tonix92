# Ndërton dhe dërgon aplikacionin Vianto për iPhone te App Store Connect (TestFlight), pa Mac.
# Kërkon: llogari Apple Developer + lidhjen "App Store Connect API key" te Codemagic me emrin "Vianto ASC".
workflows:
  vianto-ios:
    name: Vianto iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Vianto ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: tips.vianto.app
      node: 22
      xcode: latest
    scripts:
      - name: Përgatit projektin
        script: |
          cd app
          npm install --no-audit --no-fund
          WEB_SRC=../udhetimi node scripts/prepare-www.mjs
          npx cap add ios
          npx capacitor-assets generate --ios --iconBackgroundColor '#1F4E79' --splashBackgroundColor '#EBDCC2'
          npx cap sync ios
      - name: Lejet dhe versioni
        script: |
          PLIST=app/ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Vianto uses the camera so you can add a photo to your travel post.'" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Vianto uses your photos so you can add a picture to your travel post.'" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" $PLIST || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.$BUILD_NUMBER" $PLIST
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" $PLIST
      - name: Nënshkrimi
        script: |
          xcode-project use-profiles --project app/ios/App/App.xcodeproj
      - name: Ndërto IPA
        script: |
          xcode-project build-ipa --project app/ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
