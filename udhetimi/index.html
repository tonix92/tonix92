<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Udhëtimi">
<meta name="theme-color" content="#13233A">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Udhëtimi — plani yt i qytetit</title>
<meta property="og:title" content="Udhëtimi — plani yt i qytetit">
<meta property="og:description" content="Plani yt i qytetit ditë për ditë · Your city plan, day by day · Dein Stadtplan, Tag für Tag">
<meta property="og:image" content="https://tonix92.github.io/tonix92/udhetimi/og.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<style>
  :root{--bg:#f6f3ee;--card:#fff;--txt:#1f2933;--mut:#6b7280;--acc:#0b7a75;--acc2:#e8f4f3;--line:#e5e1da;--warm:#d9822b;--bad:#b42318}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .top{position:sticky;top:0;z-index:50;background:rgba(246,243,238,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
  .topin{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 16px}
  .brand{font-weight:800;font-size:19px;cursor:pointer;margin-right:auto;white-space:nowrap}
  .langsw{display:flex;background:#efebe4;border-radius:999px;padding:2px}
  .langsw button{border:0;background:none;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:700;color:var(--mut);cursor:pointer}
  .langsw button.on{background:#fff;color:var(--txt)}
  .acct{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px;cursor:pointer;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav{max-width:720px;margin:0 auto;display:flex;gap:4px;padding:0 12px 8px}
  .nav button{flex:1;border:0;background:none;padding:9px 4px;border-radius:10px;font-weight:600;color:var(--mut);cursor:pointer;font-size:14px}
  .nav button.on{background:#fff;color:var(--txt);box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .wrap{max-width:720px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
  h1{font-size:26px;margin:4px 0 2px;letter-spacing:-.5px}
  .lead{margin:0 0 16px;color:var(--mut)}
  .card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
  label:first-child{margin-top:0}
  input,select,textarea{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--txt);outline:none}
  input:focus,textarea:focus{border-color:var(--acc)}
  textarea{height:70px;resize:vertical}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stepper{display:flex;align-items:center;gap:10px}
  .stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:22px;cursor:pointer}
  .stepper b{font-size:22px;min-width:70px;text-align:center}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:14px;cursor:pointer;user-select:none}
  .chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .seg{display:flex;background:#efebe4;border-radius:12px;padding:3px;gap:3px}
  .seg button{flex:1;border:0;background:none;padding:10px 6px;border-radius:9px;font-size:14px;cursor:pointer;color:var(--mut)}
  .seg button.on{background:#fff;color:var(--txt);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .go{width:100%;border:0;border-radius:14px;background:var(--acc);color:#fff;font-size:17px;font-weight:700;padding:15px;cursor:pointer;margin-top:8px}
  .go:disabled{opacity:.6}
  .go.sec{background:var(--acc2);color:var(--acc)}
  .go.danger{background:#fdecea;color:var(--bad)}
  .err{background:#fdecea;color:#9b1c1c;border-radius:12px;padding:12px;margin-top:12px;display:none;font-size:14px}
  .note{background:var(--acc2);color:#0b4f4c;border-radius:12px;padding:12px;font-size:14px;margin-bottom:14px}
  .note a,.note button.link{color:var(--acc);font-weight:700}
  .loading{text-align:center;padding:30px 10px;display:none}
  .spin{width:42px;height:42px;border:4px solid var(--acc2);border-top-color:var(--acc);border-radius:50%;animation:s 1s linear infinite;margin:0 auto 14px}
  @keyframes s{to{transform:rotate(360deg)}}
  .view{display:none}.view.on{display:block}
  .rhead h2{margin:0;font-size:24px}
  .rhead p{color:var(--mut);margin:6px 0 0}
  .rhead .by{font-size:13px;color:var(--mut);margin-top:8px}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .btn2{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-weight:600;cursor:pointer;font-size:14px;color:var(--txt)}
  .btn2.pri{background:var(--acc);border-color:var(--acc);color:#fff}
  .daytabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
  .daytabs button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer}
  .daytabs button.on{color:#fff}
  #map{height:300px;border-radius:18px;margin-bottom:14px;z-index:1}
  .dayhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
  .dayhead h3{margin:0;font-size:19px}
  .dayhead .area{color:var(--mut);font-size:14px}
  .gm{flex:none;text-decoration:none;background:var(--acc2);color:var(--acc);font-weight:700;font-size:13px;border-radius:10px;padding:8px 10px}
  .stop{display:flex;gap:12px;position:relative;padding-bottom:16px}
  .stop:not(:last-child)::before{content:"";position:absolute;left:15px;top:34px;bottom:0;border-left:2px dashed var(--line)}
  .num{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
  .num.meal{background:var(--warm)!important;font-size:16px}
  .num.other{background:#9ca3af!important}
  .sbody{flex:1;min-width:0;cursor:pointer}
  .sbody .time{font-size:13px;color:var(--mut)}
  .sbody .nm{font-weight:700;font-size:16px;margin:1px 0 3px}
  .sbody .note2{font-size:14px;line-height:1.45}
  .sbody .tip{font-size:13px;color:var(--acc);margin-top:4px}
  .travel{font-size:12px;color:var(--mut);margin:-8px 0 10px 44px}
  .links a{font-size:12px;color:var(--mut);margin-right:10px}
  .tips li{margin:6px 0;line-height:1.45}
  .foot{color:var(--mut);font-size:12px;text-align:center;margin-top:16px}
  .numicon{width:28px;height:28px;border-radius:50%;color:#fff;font-weight:700;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);font-size:13px}
  .pcard{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;display:flex;gap:12px;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .pcard .badge{flex:none;width:52px;height:52px;border-radius:14px;background:var(--acc2);display:grid;place-items:center;font-weight:800;color:var(--acc);font-size:13px;text-align:center;line-height:1.1}
  .pcard .t{flex:1;min-width:0}
  .pcard .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pcard .t small{color:var(--mut)}
  .pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:#efebe4;color:var(--mut);margin-left:4px;vertical-align:middle}
  .pill.pub{background:var(--acc2);color:var(--acc)}
  .empty{color:var(--mut);text-align:center;padding:26px 10px}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;align-items:flex-end;justify-content:center}
  .modal-bg.on{display:flex}
  .modal{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;position:relative}
  @media(min-width:600px){.modal-bg{align-items:center}.modal{border-radius:22px}}
  .modal h3{margin:0 0 4px;font-size:21px}
  .modal .x{position:absolute;right:14px;top:12px;border:0;background:none;font-size:26px;color:var(--mut);cursor:pointer}
  .switch{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);border-radius:14px;padding:12px;margin:12px 0}
  .switch small{display:block;color:var(--mut)}
  .tog{position:relative;width:52px;height:30px;flex:none}
  .tog input{opacity:0;width:0;height:0}
  .tog span{position:absolute;inset:0;background:#d1d5db;border-radius:999px;transition:.2s;cursor:pointer}
  .tog span::after{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
  .tog input:checked+span{background:var(--acc)}
  .tog input:checked+span::after{transform:translateX(22px)}
  .sharegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
  .sharegrid a,.sharegrid button{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;font-size:12px;color:var(--txt);text-decoration:none;cursor:pointer;padding:0}
  .sharegrid .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:24px;color:#fff;font-weight:800}
  .linkbox{display:flex;gap:8px}
  .linkbox input{font-size:14px}
  .toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);background:#1f2933;color:#fff;padding:10px 16px;border-radius:12px;z-index:200;display:none;font-size:14px;max-width:90vw;text-align:center}
  #storyPrev{width:100%;border-radius:14px;display:none;margin-top:10px}
  .tabsm{display:flex;gap:6px;margin:12px 0}
  .tabsm button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px;font-weight:600;cursor:pointer}
  .tabsm button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  .prof{display:flex;gap:14px;align-items:center}
  .avatar{flex:none;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:26px}
  .pfmain{flex:1;min-width:0}
  .pfmain h2{margin:0;font-size:22px}
  .pfbio{color:var(--mut);font-size:14px;margin:4px 0}
  .pfstats{display:flex;gap:14px;font-size:14px}
  .pfstats b{font-size:16px}
  .likebtn.on{background:#fdecea;border-color:#f5c2c0;color:#b42318}
  .by a{color:var(--acc);font-weight:600;cursor:pointer;text-decoration:none}
  .pcard .likes{color:#b42318;font-size:13px;white-space:nowrap}

  /* ===== Premium layer ===== */
  :root{--ink:#13233A;--paper:#F5F5F1;--brass:#A8823A;--brass2:#C9A962;--harbor:#1F5F66;--slate:#5E6B78;
    --bg:var(--paper);--txt:#1A2433;--mut:var(--slate);--acc:var(--harbor);--acc2:#E7EFEE;--line:#E2E2DB;--warm:#8A5A2B;
    --serif:"Bodoni Moda",Didot,"Bodoni 72",Georgia,serif;--sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
  html,body{font-family:var(--sans);font-size:15.5px;-webkit-font-smoothing:antialiased;line-height:1.5}
  ::selection{background:var(--brass2);color:var(--ink)}
  :focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  .top{background:var(--ink);border-bottom:0;color:#F5F5F1}
  .topin{padding:14px 18px 10px}
  .brand{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-weight:600;font-size:22px;letter-spacing:.2px;color:#F5F5F1}
  .brand .mark{width:22px;height:22px;color:var(--brass2)}
  .langsw{background:rgba(255,255,255,.07)}
  .langsw button{color:rgba(245,245,241,.6);font-weight:600;letter-spacing:.3px}
  .langsw button.on{background:rgba(255,255,255,.14);color:#fff}
  .acct{background:transparent;border:1px solid rgba(201,169,98,.55);color:var(--brass2);font-weight:600}
  .nav{gap:22px;padding:0 18px;justify-content:flex-start}
  .nav button{flex:none;background:none;border-radius:0;padding:10px 0 12px;color:rgba(245,245,241,.55);font-weight:500;font-size:14.5px;border-bottom:2px solid transparent}
  .nav button.on{background:none;box-shadow:none;color:#fff;border-bottom-color:var(--brass2)}
  .wrap{padding-top:0}
  h1{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.08;letter-spacing:-.4px;margin:26px 0 6px;color:var(--ink)}
  .lead{color:var(--slate);font-size:15.5px;margin-bottom:22px}
  .hero{position:relative;overflow:hidden;background:var(--ink);color:#F5F5F1;margin:0 -16px 22px;padding:30px 22px 34px;border-radius:0 0 26px 26px}
  .hero h1{color:#F7F3E8;font-size:clamp(38px,9vw,56px);margin:6px 0 12px;max-width:11ch;position:relative}
  .hero .lead{color:rgba(245,245,241,.72);margin:0;max-width:34ch;position:relative}
  .meridians{position:absolute;inset:0;width:100%;height:100%;color:var(--brass2);opacity:.28}
  @media(min-width:760px){.hero{margin:0 0 26px;border-radius:0 0 30px 30px;padding:44px 40px 46px}}
  .card{border-radius:20px;padding:22px;box-shadow:0 1px 0 rgba(19,35,58,.04),0 12px 32px -18px rgba(19,35,58,.18);border:1px solid #ECECE6}
  label{font-size:13px;font-weight:600;color:var(--ink);letter-spacing:.1px;margin:20px 0 8px}
  input,select,textarea{border-radius:10px;border-color:var(--line);background:#FBFBF9;transition:border-color .15s,background .15s}
  input:focus,textarea:focus{border-color:var(--brass);background:#fff}
  #city{font-family:var(--serif);font-size:22px;padding:14px 14px}
  #city::placeholder{color:#A3A9B0}
  .stepper button{border-radius:50%;width:42px;height:42px;background:#fff;color:var(--ink);font-size:20px}
  .stepper b{font-family:var(--serif);font-weight:500;font-size:26px;color:var(--ink)}
  .chip{border-color:var(--line);color:var(--ink);padding:8px 14px;font-size:14px;transition:background .15s,color .15s}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#F7F3E8}
  .seg{background:#EEEEE8;border-radius:11px}
  .seg button{color:var(--slate);border-radius:8px;font-weight:500}
  .seg button.on{color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(19,35,58,.12)}
  .go{background:var(--ink);color:#F7F3E8;border-radius:14px;font-weight:600;font-size:16.5px;letter-spacing:.2px;padding:17px;box-shadow:inset 0 0 0 1px rgba(201,169,98,.45),0 10px 24px -12px rgba(19,35,58,.6);margin-top:22px}
  .go:hover{background:#1A2E4A}
  .go.sec{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
  .spin{border-color:#E9E3D3;border-top-color:var(--brass)}
  #loadMsg{font-family:var(--serif);font-weight:500;font-size:20px;color:var(--ink)}
  .rhead h2{font-family:var(--serif);font-weight:500;font-size:32px;line-height:1.1;color:var(--ink)}
  .dayhead h3{font-family:var(--serif);font-weight:500;font-size:24px;color:var(--ink)}
  .btn2{border-radius:11px;font-weight:600;color:var(--ink)}
  .btn2.pri{background:var(--ink);border-color:var(--ink);color:#F7F3E8}
  .daytabs button{font-weight:600;color:var(--ink);border-color:var(--line)}
  #map{border-radius:20px;box-shadow:0 12px 32px -18px rgba(19,35,58,.3)}
  .num{font-family:var(--serif);font-weight:600;font-size:15px;box-shadow:0 0 0 3px #fff}
  .stop:not(:last-child)::before{border-left:1px solid #D8D6CC}
  .sbody .nm{font-family:var(--serif);font-weight:600;font-size:18.5px;color:var(--ink)}
  .sbody .tip{color:var(--harbor)}
  .gm{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .pcard{border:1px solid #ECECE6;box-shadow:0 10px 26px -20px rgba(19,35,58,.25)}
  .pcard .badge{background:var(--ink);color:var(--brass2);font-family:var(--serif);font-weight:600}
  .pcard .t b{font-family:var(--serif);font-weight:600;font-size:17px;color:var(--ink)}
  .tabsm button.on{background:var(--ink);border-color:var(--ink);color:#F7F3E8}
  .tog input:checked+span{background:var(--ink)}
  .modal h3,.pfmain h2{font-family:var(--serif);font-weight:500;color:var(--ink)}
  .modal h3{font-size:26px}
  .note{background:#F2EEE3;color:#4F4126}
  .note a,.note button.link,.by a{color:#7C5F26}
  .toast{background:var(--ink)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01s!important}}
</style>
</head>
<body>

<div class="top">
  <div class="topin">
    <div class="brand" onclick="go('create')"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M12 3.5 14.2 12 12 20.5 9.8 12Z" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="#13233A"/></svg><span id="brandName">Udhëtimi</span></div>
    <div class="langsw" id="langSw"><button data-l="sq">SQ</button><button data-l="en">EN</button><button data-l="de">DE</button></div>
    <button class="acct" id="acctBtn" onclick="acctClick()">Hyr</button>
  </div>
  <div class="nav">
    <button data-v="create" class="on" onclick="go('create')" data-i18n="nav_create"></button>
    <button data-v="mine" onclick="go('mine')" data-i18n="nav_mine"></button>
    <button data-v="explore" onclick="go('explore')" data-i18n="nav_explore"></button>
  </div>
</div>

<div class="wrap">

<!-- ============ KRIJO ============ -->
<section class="view on" id="v-create">
  <div class="hero">
    <svg class="meridians" viewBox="0 0 400 220" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width=".6"><ellipse cx="320" cy="250" rx="60" ry="200"/><ellipse cx="320" cy="250" rx="120" ry="200"/><ellipse cx="320" cy="250" rx="180" ry="200"/><ellipse cx="320" cy="250" rx="240" ry="200"/><path d="M60 150h520M80 100h500M120 55h460M180 18h400"/></g></svg>
    <h1 data-i18n="h_where"></h1>
    <p class="lead" data-i18n="lead"></p>
  </div>
  <div class="card">
    <label for="city" data-i18n="city"></label>
    <input id="city" data-i18n-ph="city_ph" autocomplete="off">

    <label data-i18n="days_q"></label>
    <div class="stepper"><button type="button" onclick="chDays(-1)">−</button><b id="daysV"></b><button type="button" onclick="chDays(1)">+</button></div>

    <div class="grid2">
      <div><label for="start" data-i18n="start"></label><input id="start" type="time" value="09:00"></div>
      <div><label for="end" data-i18n="end"></label><input id="end" type="time" value="19:00"></div>
    </div>

    <label data-i18n="pace"></label>
    <div class="seg" data-name="pace"><button data-v="qete" data-i18n="pace_qete"></button><button data-v="normal" class="on" data-i18n="pace_normal"></button><button data-v="intensiv" data-i18n="pace_intensiv"></button></div>

    <label data-i18n="move"></label>
    <div class="seg" data-name="transport"><button data-v="kembe" class="on" data-i18n="tr_kembe"></button><button data-v="publik" data-i18n="tr_publik"></button><button data-v="vetura" data-i18n="tr_vetura"></button></div>

    <label data-i18n="interests"></label>
    <div class="chips" id="interests">

      <label>${t("email")}</label><input id="aEmail" type="email" autocomplete="email">
      <button class="go" onclick="doReset()">${t("send_link")}</button>
      <button class="go sec" onclick="showAuth('login')">${t("back")}</button>`,
    newpass: `<h3>${t("newpass_h")}</h3>
      <label>${t("newpass_lbl")}</label><input id="aPass" type="password" autocomplete="new-password">
      <button class="go" onclick="doNewPass()">${t("save")}</button>`,
  };
  B.innerHTML = (msg ? `<div class="note" style="margin-top:10px">${msg}</div>` : "") + forms[mode] + `<div class="err" id="aErr"></div>`;
  openModal("authBg");
  setTimeout(() => B.querySelector("input")?.focus(), 200);
}
function showAccount() {
  document.getElementById("authBody").innerHTML = `<h3>👤 ${esc(displayName(user))}</h3>
    <div style="color:var(--mut)">${esc(user.email)}</div>
    <button class="go" onclick="closeModal('authBg');openProfile(user.id)">${t("my_profile")}</button>
    <button class="go sec" onclick="closeModal('authBg');go('mine')">${t("my_plans_btn")}</button>
    <button class="go danger" onclick="doLogout()">${t("logout")}</button>`;
  openModal("authBg");
}
const aVal = id => document.getElementById(id)?.value.trim() || "";
function aErr(m) { const e = document.getElementById("aErr"); e.textContent = m; e.style.display = "block"; }
const authMsg = e => {
  const m = e?.message || String(e);
  if (/Invalid login/i.test(m)) return t("e_invalid");
  if (/already registered/i.test(m)) return t("e_exists");
  if (/Email not confirmed/i.test(m)) return t("e_unconfirmed");
  if (/rate limit/i.test(m)) return t("e_rate");
  if (/Password should be/i.test(m)) return t("e_pass");
  return m;
};
async function doLogin() {
  const { error } = await sb.auth.signInWithPassword({ email: aVal("aEmail"), password: document.getElementById("aPass").value });
  if (error) return aErr(authMsg(error));
  closeModal("authBg"); toast(t("logged_in"));
}
async function doSignup() {
  const name = aVal("aName"), email = aVal("aEmail"), pass = document.getElementById("aPass").value;
  if (name.length < 2) return aErr(t("need_name"));
  if (pass.length < 8) return aErr(t("e_pass"));
  const { data, error } = await sb.auth.signUp({ email, password: pass, options: { data: { name }, emailRedirectTo: APP_URL } });
  if (error) return aErr(authMsg(error));
  if (!data.session) showAuth("login", t("check_email"));
  else { closeModal("authBg"); toast(t("acct_created")); }
}
async function doReset() {
  const { error } = await sb.auth.resetPasswordForEmail(aVal("aEmail"), { redirectTo: APP_URL });
  if (error) return aErr(authMsg(error));
  showAuth("login", t("reset_sent"));
}
async function doNewPass() {
  const p = document.getElementById("aPass").value;
  if (p.length < 8) return aErr(t("e_pass"));
  const { error } = await sb.auth.updateUser({ password: p });
  if (error) return aErr(authMsg(error));
  closeModal("authBg"); toast(t("pass_changed"));
}
async function doLogout() { await sb.auth.signOut(); closeModal("authBg"); toast(t("logged_out")); if (view === "mine") loadMine(); }

async function makePlan(req) {
  req = req || readForm();
  const err = document.getElementById("err"); err.style.display = "none";
  if (!req.city) { err.textContent = t("need_city"); err.style.display = "block"; return; }
  go("create");
  const btn = document.getElementById("goBtn"); btn.disabled = true;
  const load = document.getElementById("loading"); load.style.display = "block";
  load.scrollIntoView({ behavior: "smooth", block: "center" });
  const msgs = t("loads");
  let mi = 0; const msgEl = document.getElementById("loadMsg"); msgEl.textContent = msgs[0];
  const tick = setInterval(() => { mi = Math.min(mi + 1, msgs.length - 1); msgEl.textContent = msgs[mi]; }, 6000);
  try {
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...req, ui: LANG }) });
    const data = await r.json().catch(() => ({ error: t("bad_resp") }));
    if (!r.ok || data.error) throw new Error(data.error || "Gabim " + r.status);
    const row = await storePlan(data);
    openPlan(data, row, "own");
  } catch (e) {
    err.textContent = "⚠️ " + (/fetch|Load failed|NetworkError/i.test(e.message) ? t("no_conn") : e.message);
    err.style.display = "block";
  } finally { clearInterval(tick); load.style.display = "none"; btn.disabled = false; }
}

const strip = p => { const c = JSON.parse(JSON.stringify(p, (k, v) => k === "_marker" ? undefined : v)); delete c.usage; delete c.remaining; return c; };
function rowFromPlan(p) {
  return { city: p.city?.name || p.request?.city, country: p.city?.country || null, days: p.days.length,
           title: p.title || null, summary: p.summary || null, data: strip(p), author_name: user ? displayName(user) : null };
}
async function storePlan(p) {
  if (sb && user) {
    const { data, error } = await sb.from("plans").insert(rowFromPlan(p)).select("id,user_id,is_public,author_name,saves").single();
    if (!error) return data;
    toast(t("not_saved") + error.message);
  }
  const list = localList();
  const local = { localId: "L" + Date.now(), savedAt: Date.now(), plan: strip(p) };
  list.unshift(local);
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify(list.slice(0, 10))); } catch {}
  return { localId: local.localId };
}
function localList() { try { const l = JSON.parse(localStorage.getItem(LOCAL_KEY)) || []; return l.filter(x => x.plan); } catch { return []; } }
function removeLocal(id) { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(localList().filter(x => x.localId !== id))); } catch {} }

// Pas kyçjes: kalo planet lokale në llogari
async function migrateLocal() {
  const list = localList(); if (!list.length || !sb || !user) return;
  const rows = list.map(x => rowFromPlan(x.plan));
  const { error } = await sb.from("plans").insert(rows);
  if (!error) { try { localStorage.removeItem(LOCAL_KEY); } catch {} toast(t("migrated", rows.length)); }
}

function planCard(o) {
  const pub = o.is_public ? `<span class="pill pub">${t("b_public")}</span>` : o.local ? `<span class="pill">${t("b_local")}</span>` : `<span class="pill">${t("b_private")}</span>`;
  const meta = [o.country, o.author && view === "explore" ? t("by", o.author) : null, o.date, o.saves ? `⭐ ${o.saves}` : null].filter(Boolean).join(" · ");
  return `<div class="pcard" onclick="${o.onclick}"><div class="badge">${t("days_badge", o.days)}</div>
    <div class="t"><b>${esc(o.city)} ${view === "mine" || (view === "profile" && o.mine) ? pub : ""}</b><small>${esc(o.title || "")}</small><br><small>${esc(meta)}</small></div>${o.likes ? `<span class="likes">❤️ ${o.likes}</span>` : ""}<span>›</span></div>`;
}
const fmtDate = d => new Date(d).toLocaleDateString(t("locale"), LANG === "sq" ? { day: "2-digit", month: "2-digit", year: "numeric" } : { day: "numeric", month: "short", year: "numeric" });

async function loadMine() {

    lead.innerHTML = sb ? `${t("mine_lead_out")} <button class="btn2 pri" onclick="showAuth('signup')" style="margin-top:8px">${t("create_acct_btn")}</button>` : t("mine_local");
  } else { lead.textContent = t("mine_lead_in"); box.innerHTML = `<div class="empty">${t("loading")}</div>`;
    const { data, error } = await sb.from("plans").select("id,city,country,days,title,is_public,saves,likes,created_at").eq("user_id", user.id).order("created_at", { ascending: false }).limit(100);
    if (error) html += `<div class="err" style="display:block">${esc(error.message)}</div>`;
    (data || []).forEach(r => html += planCard({ ...r, date: fmtDate(r.created_at), onclick: `openById('${r.id}')` }));
  }
  local.forEach(x => html += planCard({ city: x.plan.city?.name, country: x.plan.city?.country, days: x.plan.days.length, title: x.plan.title,
    local: true, date: fmtDate(x.savedAt), onclick: `openLocal('${x.localId}')` }));

}
function gmapsLink(d) {

}

async function makeStory() {
  const W = 1080, H = 1920, c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#0b7a75"); g.addColorStop(1, "#0d3b52");
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.fillStyle = "rgba(255,255,255,.07)"; x.beginPath(); x.arc(W - 60, 160, 340, 0, 7); x.fill(); x.beginPath(); x.arc(60, H - 200, 300, 0, 7); x.fill();
  const F = "system-ui,-apple-system,'Segoe UI',sans-serif";
  x.fillStyle = "rgba(255,255,255,.85)"; x.font = `600 40px ${F}`; x.fillText("🧭 " + APP_NAME, 80, 150);
  x.fillStyle = "#fff"; x.font = `800 112px ${F}`;
  let y = wrap(x, plan.city?.name || plan.title, 80, 300, W - 160, 120, 2);
  x.font = `500 46px ${F}`; x.fillStyle = "rgba(255,255,255,.85)";
  x.fillText(t("story_days", plan.days.length, plan.city?.country), 80, y + 85);
  y += 160;
  const maxDays = Math.min(plan.days.length, 4), perDay = plan.days.length > 3 ? 3 : plan.days.length === 1 ? 8 : 5;
  for (let k = 0; k < maxDays; k++) {
    const d = plan.days[k], col = COLORS[k % COLORS.length];
    const cnt = Math.max(1, Math.min(perDay, d.stops.filter(s => s.type !== "meal").length));
    roundRect(x, 60, y, W - 120, 110 + cnt * 62, 36, "rgba(255,255,255,.96)");
    x.fillStyle = col; x.font = `800 40px ${F}`; x.fillText(`${t("day").toUpperCase()} ${d.day || k + 1}`, 100, y + 64);
    x.fillStyle = "#6b7280"; x.font = `500 34px ${F}`; clip(x, d.theme || "", 330, y + 64, W - 450);
    const sts = d.stops.filter(s => s.type !== "meal").slice(0, perDay);
    sts.forEach((s, j) => {
      const yy = y + 130 + j * 62;
      x.fillStyle = col; x.beginPath(); x.arc(122, yy - 12, 22, 0, 7); x.fill();
      x.fillStyle = "#fff"; x.font = `700 26px ${F}`; x.textAlign = "center"; x.fillText(j + 1, 122, yy - 3); x.textAlign = "left";
      x.fillStyle = "#1f2933"; x.font = `600 36px ${F}`; clip(x, s.name, 165, yy, W - 290);
    });
    y += 110 + cnt * 62 + 30;
    if (y > H - 260) break;
  }
  if (plan.days.length > maxDays) { x.fillStyle = "#fff"; x.font = `600 38px ${F}`; x.fillText(t("story_more", plan.days.length - maxDays), 80, y + 20); }
  x.fillStyle = "rgba(255,255,255,.9)"; x.font = `600 34px ${F}`; x.textAlign = "center";
  x.fillText(t("story_free"), W / 2, H - 150);
  x.font = `800 38px ${F}`; x.fillText(APP_URL.replace("https://", "").replace(/\/$/, ""), W / 2, H - 95);
  x.textAlign = "left";

  const blob = await new Promise(r => c.toBlob(r, "image/png"));
  const file = new File([blob], `udhetimi-${(plan.city?.name || "plan").toLowerCase().replace(/\s+/g, "-")}.png`, { type: "image/png" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: plan.title }); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  const url = URL.createObjectURL(blob), img = document.getElementById("storyPrev");
  img.src = url; img.style.display = "block";
  const help = document.getElementById("storyHelp");
  help.innerHTML = `${t("story_help")} <a href="${url}" download="${file.name}">${t("download")}</a>`;
  help.style.display = "block";
  img.scrollIntoView({ behavior: "smooth", block: "center" });
}
function wrap(x, text, X, Y, maxW, lh, maxLines) {
  const words = String(text).split(" "); let line = "", lines = 0;
  for (const w of words) {
    const t = line ? line + " " + w : w;
    if (x.measureText(t).width > maxW && line) { x.fillText(line, X, Y); Y += lh; line = w; if (++lines >= maxLines - 1) break; }
    else line = t;
  }
  x.fillText(line, X, Y); return Y;
}
function clip(x, t, X, Y, maxW) { t = String(t); if (x.measureText(t).width <= maxW) return x.fillText(t, X, Y); while (t.length > 1 && x.measureText(t + "…").width > maxW) t = t.slice(0, -1); x.fillText(t + "…", X, Y); }
function roundRect(x, X, Y, w, h, r, fill) { x.fillStyle = fill; x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.fill(); }

// ================== NDIHMËSE ==================
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function addMin(t, m) { const [h, mi] = t.split(":").map(Number); const v = h * 60 + mi + m; return `${String(Math.floor(v / 60) % 24).padStart(2, "0")}:${String(v % 60).padStart(2, "0")}`; }
function fmtDur(m) { return m >= 60 ? `${Math.floor(m / 60)} ${t("h")}${m % 60 ? " " + (m % 60) + " min" : ""}` : m + " min"; }
function wikiUrl(w) { const [l, ...t] = w.split(":"); return `https://${l}.wikipedia.org/wiki/${encodeURIComponent(t.join(":").replace(/ /g, "_"))}`; }
function tIcon() { return { kembe: "🚶", publik: "🚶/🚇", vetura: "🚗" }[plan.request?.transport] || "🚶"; }
function openModal(id) { document.getElementById(id).classList.add("on"); }
function closeModal(id) { document.getElementById(id).classList.remove("on"); }
let tt; function toast(m) { const el = document.getElementById("toast"); el.textContent = m; el.style.display = "block"; clearTimeout(tt); tt = setTimeout(() => el.style.display = "none", 2600); }
let pend = null; function confirmTap(k) { if (pend === k) { pend = null; return true; } pend = k; toast(t("press_again")); setTimeout(() => pend = null, 2500); return false; }
document.getElementById("city").addEventListener("keydown", e => { if (e.key === "Enter") makePlan(); });

(async function init() {
  if (sb) {

      const was = user; user = session?.user || null; refreshAcct();

      if (!was && user) loadMyProfile();
      if (ev === "PASSWORD_RECOVERY") showAuth("newpass");
      if (!was && user && ev === "SIGNED_IN") { migrateLocal(); if (view === "mine") loadMine(); if (view === "plan" && mode === "own" && row.localId) renderActions(); }
    });
  }
  applyLang();
  const params = new URL(location.href).searchParams;
  const pid = params.get("p"), uid = params.get("u");
  if (pid && sb) openById(pid);
  else if (uid && sb) openProfile(uid);
})();
