# Krijon NJË HERË çelësin e nënshkrimit për Google Play.
# Para nisjes: GitHub → Settings → Secrets → Actions → ANDROID_KEYSTORE_PASSWORD (të paktën 16 shenja).
# Çelësi ruhet në repo vetëm i enkriptuar (app/upload.jks.enc); pa fjalëkalimin nuk përdoret dot.
name: Viaro – krijo çelësin e nënshkrimit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Krijo çelësin dhe ruaje të enkriptuar
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -f app/upload.jks.enc ]; then echo "::error::Çelësi ekziston tashmë (app/upload.jks.enc). Nuk krijoj një të ri."; exit 1; fi
          if [ ${#KS_PASS} -lt 16 ]; then echo "::error::Sekreti ANDROID_KEYSTORE_PASSWORD mungon ose ka më pak se 16 shenja."; exit 1; fi
          keytool -genkeypair -storetype PKCS12 -keystore upload.jks -alias viaro -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Viaro, O=Viaro"
          openssl enc -aes-256-cbc -pbkdf2 -iter 300000 -salt -in upload.jks -out app/upload.jks.enc -pass env:KS_PASS
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -in app/upload.jks.enc -out check.jks -pass env:KS_PASS
          cmp upload.jks check.jks
          echo "Gjurmët e certifikatës (publike, për Google Play / Firebase):"
          keytool -list -v -keystore upload.jks -storepass "$KS_PASS" | grep -E "SHA1:|SHA256:" | sed -E 's/^[[:space:]]*/::notice::/'
          rm -f upload.jks check.jks
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/upload.jks.enc
          git commit -m "Çelësi i nënshkrimit për Google Play (i enkriptuar)"
          git push
