# Ndërton aplikacionin Viaro për iPhone në cloud (Mac i GitHub) dhe e ngarkon në TestFlight.
# Nisja: GitHub → Actions → "Viaro iOS" → Run workflow.
# Sekretet e nevojshme (GitHub → Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID   – Team ID (10 shenja) nga developer.apple.com → Membership
#   ASC_KEY_ID      – Key ID i çelësit API të App Store Connect
#   ASC_ISSUER_ID   – Issuer ID (lart te faqja e çelësave API)
#   ASC_KEY_P8      – përmbajtja e plotë e skedarit AuthKey_XXXX.p8
#   GOOGLE_SERVICE_INFO_PLIST – (opsional) teksti i GoogleService-Info.plist nga Firebase → njoftimet push
name: Viaro iOS

on:
  workflow_dispatch:
    inputs:
      web:
        description: "Cila faqe futet në aplikacion (live = faqja kryesore, beta = për provë)"
        type: choice
        options: [live, beta]
        default: live
      upload:
        description: "Ngarko në TestFlight"
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Zgjidh Xcode 26 (Apple e kërkon për App Store)
        run: |
          ls -d /Applications/Xcode*.app || true
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)
          [ -n "$X" ] || X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$X" ]; then echo "::error::Mungon Xcode 26 në këtë runner"; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: Kontrollo sekretet
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          miss=""
          [ -n "$TEAM" ] || miss="$miss APPLE_TEAM_ID"
          [ -n "$KID" ] || miss="$miss ASC_KEY_ID"
          [ -n "$ISS" ] || miss="$miss ASC_ISSUER_ID"
          [ -n "$P8" ] || miss="$miss ASC_KEY_P8"
          if [ -n "$miss" ]; then echo "::error::Mungojnë sekretet:$miss"; exit 1; fi
          echo "Sekretet OK"

      - name: Përgatit projektin
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          npm install --no-audit --no-fund
          WEB_SRC=../udhetimi node scripts/prepare-www.mjs
          if [ "${{ inputs.web }}" = "beta" ]; then
            cp ../udhetimi/beta/index.html www/index.html
            if [ -f ../udhetimi/beta/privacy.html ]; then cp ../udhetimi/beta/privacy.html www/privacy.html; fi
            echo "::notice::Ky build përmban faqen BETA (vetëm për provë)."
          fi
          # Njoftimet push ndizen vetëm kur ekziston GoogleService-Info.plist
          if [ -n "$PLIST" ]; then echo '{"push":true}' > www/push-cfg.json; else echo '{"push":false}' > www/push-cfg.json; fi
          cat www/push-cfg.json
          npx cap add ios
          npx capacitor-assets generate --ios --iconBackgroundColor '#C8202F' --splashBackgroundColor '#F7F2EA' --splashBackgroundColorDark '#161616'

      - name: Plugin-i i printimit (Ruaj si PDF) dhe tekstet e lejeve
        run: |
          D=ios/App/App
          cat > $D/ViaroPrintPlugin.swift <<'SWIFT'
          import UIKit
          import Capacitor

          @objc(ViaroPrintPlugin)
          public class ViaroPrintPlugin: CAPPlugin, CAPBridgedPlugin {
              public let identifier = "ViaroPrintPlugin"
              public let jsName = "ViaroPrint"
              public let pluginMethods: [CAPPluginMethod] = [
                  CAPPluginMethod(name: "print", returnType: CAPPluginReturnPromise)
              ]

              @objc func print(_ call: CAPPluginCall) {
                  let name = call.getString("name") ?? "Viaro"
                  DispatchQueue.main.async {
                      guard let web = self.bridge?.webView else { call.reject("no_webview"); return }
                      let info = UIPrintInfo(dictionary: nil)
                      info.outputType = .general
                      info.jobName = name
                      let pc = UIPrintInteractionController.shared
                      pc.printInfo = info
                      pc.printFormatter = web.viewPrintFormatter()
                      pc.present(animated: true) { _, _, _ in call.resolve() }
                  }
              }
          }
          SWIFT
          cat > $D/ViaroViewController.swift <<'SWIFT'
          import UIKit
          import Capacitor

          class ViaroViewController: CAPBridgeViewController {
              override open func capacitorDidLoad() {
                  bridge?.registerPluginInstance(ViaroPrintPlugin())
              }
          }
          SWIFT
          # Storyboard-i përdor kontrolluesin tonë (që regjistron plugin-in)
          sed -i '' 's/customClass="CAPBridgeViewController" customModule="Capacitor"/customClass="ViaroViewController" customModule="App" customModuleProvider="target"/' $D/Base.lproj/Main.storyboard
          grep -c ViaroViewController $D/Base.lproj/Main.storyboard
          # Shto skedarët Swift në projektin e Xcode
          if grep -q PBXFileSystemSynchronizedRootGroup ios/App/App.xcodeproj/project.pbxproj; then
            echo "Projekti i sinkronizuar: skedarët Swift përfshihen vetë"
          else
          sudo gem install xcodeproj --no-document >/dev/null
          ruby -e '
            require "xcodeproj"
            p = Xcodeproj::Project.open("ios/App/App.xcodeproj")
            t = p.targets.find { |x| x.name == "App" }
            g = p.main_group.find_subpath("App", false)
            %w[ViaroPrintPlugin.swift ViaroViewController.swift].each do |f|
              next if t.source_build_phase.files_references.any? { |r| r.path == f }
              t.add_file_references([g.new_reference(f)])
            end
            p.save
            puts "Swift OK"'
          fi
          # Tekstet e lejeve (Apple i kërkon) dhe deklarata e enkriptimit
          P=$D/Info.plist
          pb() { /usr/libexec/PlistBuddy -c "Delete :$1" $P 2>/dev/null || true; /usr/libexec/PlistBuddy -c "Add :$1 $2 $3" $P; }
          pb NSLocationWhenInUseUsageDescription string "Viaro uses your location to show places near you and to mark stops you have reached. Your location is not stored."
          pb NSPhotoLibraryUsageDescription string "Choose a photo for your profile or a trip post."
          pb NSCameraUsageDescription string "Take a photo for your profile or a trip post."
          pb ITSAppUsesNonExemptEncryption bool false
          pb CFBundleDisplayName string Viaro
          npx cap sync ios

      - name: Njoftimet push (Firebase Cloud Messaging)
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -z "$PLIST" ]; then echo "::notice::Pa GoogleService-Info.plist: build pa njoftime push"; exit 0; fi
          D=ios/App/App
          printf '%s\n' "$PLIST" > $D/GoogleService-Info.plist
          plutil -lint $D/GoogleService-Info.plist
          B=$(/usr/libexec/PlistBuddy -c "Print :BUNDLE_ID" $D/GoogleService-Info.plist)
          if [ "$B" != "tips.vianto.app" ]; then echo "::error::GoogleService-Info.plist është për $B, jo tips.vianto.app"; exit 1; fi
          cat > ios/App/Viaro.entitlements <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>aps-environment</key><string>production</string>
          </dict></plist>
          XML
          plutil -lint ios/App/Viaro.entitlements
          # AppDelegate: Firebase + token FCM për plugin-in e njoftimeve
          cat > $RUNNER_TEMP/patch.rb <<'RUBY'
          f = "ios/App/App/AppDelegate.swift"
          s = File.read(f)
          s.sub!("import Capacitor\n", "import Capacitor\nimport FirebaseCore\nimport FirebaseMessaging\n")
          s.sub!(/(didFinishLaunchingWithOptions[^{]*\{)/) { $1 + "\n        FirebaseApp.configure()" }
          extra = <<~SW

              func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                  Messaging.messaging().apnsToken = deviceToken
                  Messaging.messaging().token { token, error in
                      if let error = error {
                          NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)
                      } else if let token = token {
                          NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: token)
                      }
                  }
              }

              func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {
                  NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)
              }
          SW
          i = s.rindex("}")
          s = s[0...i] + extra + "}\n"
          abort("AppDelegate: patch failed") unless s.include?("FirebaseApp.configure()") && s.include?("import FirebaseMessaging")
          File.write(f, s)
          puts s
          RUBY
          ruby $RUNNER_TEMP/patch.rb
          /usr/libexec/PlistBuddy -c "Delete :FirebaseAppDelegateProxyEnabled" $D/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :FirebaseAppDelegateProxyEnabled bool false" $D/Info.plist
          # Projekti i Xcode: plist-i, entitlements dhe paketa Firebase (SPM)
          sudo gem install xcodeproj --no-document >/dev/null
          cat > $RUNNER_TEMP/proj.rb <<'RUBY'
          require "xcodeproj"
          p = Xcodeproj::Project.open("ios/App/App.xcodeproj")
          t = p.targets.find { |x| x.name == "App" }
          g = p.main_group.find_subpath("App", false)
          unless t.resources_build_phase.files_references.any? { |r| r && r.path == "GoogleService-Info.plist" }
            t.resources_build_phase.add_file_reference(g.new_reference("GoogleService-Info.plist"))
          end
          t.build_configurations.each { |c| c.build_settings["CODE_SIGN_ENTITLEMENTS"] = "Viaro.entitlements" }
          pkg = p.root_object.package_references.find { |r| r.respond_to?(:repositoryURL) && r.repositoryURL.to_s.include?("firebase-ios-sdk") }
          unless pkg
            pkg = p.new(Xcodeproj::Project::Object::XCRemoteSwiftPackageReference)
            pkg.repositoryURL = "https://github.com/firebase/firebase-ios-sdk"
            pkg.requirement = { "kind" => "upToNextMajorVersion", "minimumVersion" => "12.0.0" }
            p.root_object.package_references << pkg
          end
          unless t.package_product_dependencies.any? { |d| d.product_name == "FirebaseMessaging" }
            dep = p.new(Xcodeproj::Project::Object::XCSwiftPackageProductDependency)
            dep.package = pkg
            dep.product_name = "FirebaseMessaging"
            t.package_product_dependencies << dep
            bf = p.new(Xcodeproj::Project::Object::PBXBuildFile)
            bf.product_ref = dep
            t.frameworks_build_phase.files << bf
          end
          p.save
          puts "Firebase OK"
          RUBY
          ruby $RUNNER_TEMP/proj.rb
          grep -n "firebase-ios-sdk\|FirebaseMessaging\|GoogleService-Info\|CODE_SIGN_ENTITLEMENTS" ios/App/App.xcodeproj/project.pbxproj | head -20
          echo "PUSH=1" >> $GITHUB_ENV

      - name: Versioni
        working-directory: app/ios/App
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.${{ github.run_number }}" App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" App/Info.plist 2>/dev/null || true
          sed -i '' -E "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = 1.0.${{ github.run_number }};/g; s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = ${{ github.run_number }};/g" App.xcodeproj/project.pbxproj
          grep -m2 -E "MARKETING_VERSION|CURRENT_PROJECT_VERSION" App.xcodeproj/project.pbxproj

      - name: Ndërto dhe nënshkruaj (IPA)
        working-directory: app/ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_$KID.p8
          printf '%s' "$P8" > $KEY
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $KID -authenticationKeyIssuerID $ISS"
          SIGN=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=)
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation -skipMacroValidation \
            -archivePath $RUNNER_TEMP/Viaro.xcarchive DEVELOPMENT_TEAM=$TEAM PRODUCT_BUNDLE_IDENTIFIER=tips.vianto.app \
            "${SIGN[@]}" archive | tail -n 40
          APP=$RUNNER_TEMP/Viaro.xcarchive/Products/Applications/App.app
          if [ "$PUSH" = "1" ]; then
            # Vendos entitlements (aps-environment) me nënshkrim lokal; eksporti i ruan kur nënshkruan për App Store
            for f in "$APP"/Frameworks/*; do [ -e "$f" ] && codesign --force --sign - --timestamp=none "$f"; done
            codesign --force --sign - --timestamp=none --entitlements Viaro.entitlements "$APP"
            E=$(codesign -d --entitlements - "$APP" 2>&1 || true); echo "$E"
            echo "$E" | grep -q aps-environment || { echo "::error::Arkivi nuk ka aps-environment"; exit 1; }
            [ -f "$APP/GoogleService-Info.plist" ] || { echo "::error::Mungon GoogleService-Info.plist në app"; exit 1; }
          fi
          # Nënshkrimi për App Store bëhet te eksporti (certifikatë dhe profil i krijuar automatikisht nga Apple)
          mkopts() {
          cat > $RUNNER_TEMP/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$1</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          }
          mkopts export
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/Viaro.xcarchive -exportOptionsPlist $RUNNER_TEMP/export.plist \
            -exportPath $GITHUB_WORKSPACE/out $AUTH | tail -n 40
          IPA=$(ls $GITHUB_WORKSPACE/out/*.ipa)
          if [ "$PUSH" = "1" ]; then
            rm -rf $RUNNER_TEMP/ipa && mkdir $RUNNER_TEMP/ipa && unzip -q "$IPA" -d $RUNNER_TEMP/ipa
            E=$(codesign -d --entitlements - $RUNNER_TEMP/ipa/Payload/App.app 2>&1 || true); echo "$E"
            echo "$E" | grep -q aps-environment || { echo "::error::IPA-ja e nënshkruar nuk ka aps-environment (njoftimet nuk do punonin)"; exit 1; }
            echo "::notice::Njoftimet push janë aktive në këtë build."
          fi
          if [ "${{ inputs.upload }}" = "true" ]; then
            mkopts upload
            xcodebuild -exportArchive -archivePath $RUNNER_TEMP/Viaro.xcarchive -exportOptionsPlist $RUNNER_TEMP/export.plist \
              -exportPath $RUNNER_TEMP/up $AUTH | tail -n 40
            echo "::notice::U ngarkua në App Store Connect. Pas 5–30 min del te TestFlight."
          fi
          rm -f $KEY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viaro-ios-${{ github.run_number }}
          path: out/
          if-no-files-found: ignore
