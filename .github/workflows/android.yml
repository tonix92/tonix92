# Ndërton aplikacionin Viaro për Android në cloud.
# Nisja: GitHub → Actions → "Vianto Android" → Run workflow.
# Rezultati (Artifacts): vianto-test.apk (për ta provuar në telefon) dhe vianto-play.aab (për Google Play).
name: Viaro Android

on:
  workflow_dispatch:
    inputs:
      web:
        description: "Cila faqe futet në aplikacion (live = faqja kryesore, beta = për provë)"
        type: choice
        options: [live, beta]
        default: live

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Përgatit projektin
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          npm install --no-audit --no-fund
          WEB_SRC=../udhetimi node scripts/prepare-www.mjs
          if [ "${{ inputs.web }}" = "beta" ]; then
            cp ../udhetimi/beta/index.html www/index.html
            if [ -f ../udhetimi/beta/privacy.html ]; then cp ../udhetimi/beta/privacy.html www/privacy.html; fi
            echo "::notice::Ky build përmban faqen BETA (vetëm për provë)."
          fi
          # Njoftimet push: vetëm kur ekziston sekreti i Firebase (pa të, aplikacioni punon pa push)
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo '{"push":true}' > www/push-cfg.json; else echo "::warning::Mungon sekreti GOOGLE_SERVICES_JSON – njoftimet push janë të çaktivizuara në këtë build."; fi
          npx cap add android
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            node -e "const j=require('./android/app/google-services.json');if(!j.client.some(c=>c.client_info.android_client_info.package_name==='tips.vianto.app'))throw new Error('package')" && echo "Firebase: google-services.json OK"
          fi
          # Printimi i telefonit ("Ruaj si PDF") – plugin i vogël i Viaro-s
          J=android/app/src/main/java/tips/vianto/app
          cat > $J/ViaroPrintPlugin.java <<'JAVA'
          package tips.vianto.app;

          import android.content.Context;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "ViaroPrint")
          public class ViaroPrintPlugin extends Plugin {
              @PluginMethod
              public void print(PluginCall call) {
                  final String name = call.getString("name", "Viaro");
                  getActivity().runOnUiThread(() -> {
                      try {
                          PrintManager pm = (PrintManager) getActivity().getSystemService(Context.PRINT_SERVICE);
                          PrintDocumentAdapter adapter = getBridge().getWebView().createPrintDocumentAdapter(name);
                          pm.print(name, adapter, new PrintAttributes.Builder().build());
                          call.resolve();
                      } catch (Exception e) {
                          call.reject("print_failed", e);
                      }
                  });
              }
          }
          JAVA
          cat > $J/MainActivity.java <<'JAVA'
          package tips.vianto.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(ViaroPrintPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          # Leja e vendndodhjes për "Çfarë të vizitoj tani?"
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -c ACCESS_FINE_LOCATION android/app/src/main/AndroidManifest.xml
          # Leja për kujtesat e udhëtimit (Android 13+)
          grep -q POST_NOTIFICATIONS android/app/src/main/AndroidManifest.xml || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          npx capacitor-assets generate --android --iconBackgroundColor '#C8202F' --splashBackgroundColor '#F7F2EA' --splashBackgroundColorDark '#161616'
          npx cap sync android

      - name: Versioni
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]+\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Ndërto APK dhe AAB
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Nënshkruaj AAB për Google Play
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p ../out
          cp android/app/build/outputs/apk/debug/app-debug.apk ../out/vianto-test.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > upload.jks
            jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore upload.jks -storepass "$KS_PASS" -keypass "$KS_PASS" "$AAB" "$KS_ALIAS"
            rm upload.jks
            cp "$AAB" ../out/vianto-play.aab
            echo "AAB u nënshkrua."
          else
            cp "$AAB" ../out/vianto-play-PA-NENSHKRIM.aab
            echo "::warning::Mungojnë sekretet ANDROID_KEYSTORE_*. AAB-ja nuk është e nënshkruar dhe Google Play nuk e pranon."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: vianto-android-${{ github.run_number }}
          path: out/
