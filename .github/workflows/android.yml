# Ndërton aplikacionin Viaro për Android në cloud.
# Nisja: GitHub → Actions → "Vianto Android" → Run workflow.
# Rezultati (Artifacts): vianto-test.apk (për ta provuar në telefon) dhe vianto-play.aab (për Google Play).
name: Viaro Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Përgatit projektin
        run: |
          npm install --no-audit --no-fund
          WEB_SRC=../udhetimi node scripts/prepare-www.mjs
          npx cap add android
          # Leja e vendndodhjes për "Çfarë të vizitoj tani?"
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -c ACCESS_FINE_LOCATION android/app/src/main/AndroidManifest.xml
          npx capacitor-assets generate --android --iconBackgroundColor '#C8202F' --splashBackgroundColor '#F7F2EA' --splashBackgroundColorDark '#161616'
          npx cap sync android

      - name: Versioni
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]+\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Ndërto APK dhe AAB
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Nënshkruaj AAB për Google Play
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p ../out
          cp android/app/build/outputs/apk/debug/app-debug.apk ../out/vianto-test.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > upload.jks
            jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore upload.jks -storepass "$KS_PASS" -keypass "$KS_PASS" "$AAB" "$KS_ALIAS"
            rm upload.jks
            cp "$AAB" ../out/vianto-play.aab
            echo "AAB u nënshkrua."
          else
            cp "$AAB" ../out/vianto-play-PA-NENSHKRIM.aab
            echo "::warning::Mungojnë sekretet ANDROID_KEYSTORE_*. AAB-ja nuk është e nënshkruar dhe Google Play nuk e pranon."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: vianto-android-${{ github.run_number }}
          path: out/
